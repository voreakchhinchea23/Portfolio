<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Rounded Tech Frame (Midnight Obsidian Base with Electric Cyan Rim) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="#060919" stroke="#0284c7" stroke-width="14" />
  
  <!-- Subtle Inset Specular Glass Edge Accent -->
  <rect x="38" y="38" width="436" height="436" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="2" />

  <!-- Letter V: Bold Electric Cyan Chevron with Parallel Flow -->
  <path d="M 105 160 L 182 352 L 259 160" 
        fill="none" stroke="#38bdf8" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter C: Precision Tech Code Bracket in Pure White, Nesting with V -->
  <path d="M 410 160 L 336 160 L 296 256 L 336 352 L 410 352" 
        fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
</svg>